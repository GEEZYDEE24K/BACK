name: CI - Revisión automática del proyecto

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  revision:
    name: Revisar y probar el proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend_estudiantil
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio respx httpx aiosqlite

      - name: Revisar calidad del código
        working-directory: backend_estudiantil
        run: |
          pip install ruff
          ruff check . --ignore E501
        continue-on-error: true

      - name: Correr las pruebas
        working-directory: backend_estudiantil
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          JWT_SECRET_KEY: clave_de_prueba_local_12345
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          REFRESH_TOKEN_EXPIRE_DAYS: 7
          COOKIE_SECURE: "false"
          COOKIE_HTTPONLY: "true"
          COOKIE_SAMESITE: lax
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          GOOGLE_REDIRECT_URI: http://localhost:8000/auth/google/callback
          GOOGLE_SCOPES: openid email profile
          FACEBOOK_CLIENT_ID: dummy
          FACEBOOK_CLIENT_SECRET: dummy
          FACEBOOK_REDIRECT_URI: http://localhost:8000/auth/facebook/callback
          FACEBOOK_SCOPES: email,public_profile
          DATABASEPROVIDER: SQLite
        run: |
          pytest tests/ -q --tb=short

